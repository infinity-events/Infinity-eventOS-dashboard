name: Build iOS IPA and publish AltStore Classic source

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, for example 1.0.0"
        required: true
        default: "1.0.0"
      build:
        description: "Build number"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://infinity-eventos-api.onrender.com' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web application
        run: npm run build
      - name: Verify web build output
        run: test -s dist/index.html
      - name: Add Capacitor iOS platform
        run: npx cap add ios
      - name: Sync web assets into iOS project
        run: npx cap sync ios
      - name: Verify Capacitor web assets
        run: test -s ios/App/App/public/index.html
      - name: Set app version and permissions
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ inputs.version }}" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build }}" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Infinity EventOS usa la fotocamera per scansionare i QR code." ios/App/App/Info.plist
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
      - name: Package IPA
        run: |
          rm -rf Payload InfinityEventOS.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/InfinityEventOS.app
          ditto -c -k --sequesterRsrc --keepParent Payload InfinityEventOS.ipa
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-v${{ inputs.version }}-${{ inputs.build }}"
          gh release create "$TAG" InfinityEventOS.ipa \
            --title "Infinity EventOS iOS ${{ inputs.version }} (${{ inputs.build }})" \
            --notes "Build iOS per AltStore Classic."
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Generate AltStore Classic source
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          APP_VERSION: ${{ inputs.version }}
          APP_BUILD: ${{ inputs.build }}
        run: |
          mkdir -p altstore
          IPA_SIZE=$(stat -f%z InfinityEventOS.ipa)
          IPA_SHA256=$(shasum -a 256 InfinityEventOS.ipa | awk '{print $1}')
          export IPA_SIZE IPA_SHA256
          node <<'NODE'
          const fs = require("fs");
          const source = {
            name: "Infinity EventOS",
            subtitle: "App ufficiale Infinity EventOS",
            description: "Source ufficiale per Infinity EventOS.",
            website: "https://github.com/infinity-events/Infinity-eventOS-dashboard",
            apps: [{
              name: "Infinity EventOS",
              bundleIdentifier: "com.infinityevents.eventos",
              developerName: "Infinity Events",
              subtitle: "Gestione eventi e operazioni",
              localizedDescription: "Dashboard mobile di Infinity EventOS.",
              iconURL: "https://infinityeventos.dpdns.org/favicon.svg",
              category: "utilities",
              versions: [{
                version: process.env.APP_VERSION,
                buildVersion: process.env.APP_BUILD,
                date: new Date().toISOString(),
                localizedDescription: "Build iOS per AltStore Classic.",
                downloadURL: "https://github.com/infinity-events/Infinity-eventOS-dashboard/releases/download/" + process.env.RELEASE_TAG + "/InfinityEventOS.ipa",
                size: Number(process.env.IPA_SIZE),
                sha256: process.env.IPA_SHA256,
                minOSVersion: "16.0"
              }],
              appPermissions: {
                entitlements: [],
                privacy: {
                  NSCameraUsageDescription: "Infinity EventOS usa la fotocamera per scansionare i QR code."
                }
              }
            }],
            news: []
          };
          fs.writeFileSync("altstore/source.json", JSON.stringify(source, null, 2) + "\n");
          NODE
      - name: Commit updated AltStore source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          git commit -m "Publish AltStore Classic source for ${{ inputs.version }} (${{ inputs.build }})"
          git push origin HEAD:main
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: InfinityEventOS-iOS-${{ inputs.version }}-${{ inputs.build }}
          path: InfinityEventOS.ipa
          if-no-files-found: error
