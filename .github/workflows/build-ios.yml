name: Build iOS IPA for AltStore Classic

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, for example 1.0.0"
        required: true
        default: "1.0.0"
      build:
        description: "Build number"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web application
        run: npm run build
      - name: Add Capacitor iOS platform
        run: npx cap add ios
      - name: Sync web assets into iOS project
        run: npx cap sync ios
      - name: Set app version and build
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ inputs.version }}" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build }}" ios/App/App/Info.plist
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
      - name: Package IPA
        run: |
          rm -rf Payload InfinityEventOS.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/InfinityEventOS.app
          ditto -c -k --sequesterRsrc --keepParent Payload InfinityEventOS.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: InfinityEventOS-iOS-${{ inputs.version }}-${{ inputs.build }}
          path: InfinityEventOS.ipa
          if-no-files-found: error
